name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, types, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run all local checks
        run: npm run check

      - name: Verify manifests were not changed by checks
        run: git diff --exit-code -- package.json package-lock.json

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Visibility, not a security release gate; review results before public hosting.
      - name: Report production dependency vulnerabilities
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev

      - name: Summarize audit status without hiding failures
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo "## Production dependency audit"
            echo "Outcome: $AUDIT_OUTCOME"
            echo "This report is informational and does not block the quality checks."
            echo "A green CI result is not proof of production readiness."
            echo "Review the audit step log and dependency guidance in .github/SECURITY.md."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$AUDIT_OUTCOME" != "success" ]; then
            echo "::warning::Dependency audit did not pass. Review its log before public deployment."
          fi
